<section class="pagina">
  <h1>Registro</h1>

  <p class="subtitulo">
    Completá los datos para crear un usuario y acceder a la sala de juegos.
  </p>

  <form class="formulario">
    <label>Correo</label>
    <input
      type="email"
      [(ngModel)]="email"
      name="email"
      placeholder="Ingrese su correo"
    >

    <label>Nombre</label>
    <input
      type="text"
      [(ngModel)]="nombre"
      name="nombre"
      placeholder="Ingrese su nombre"
    >

    <label>Apellido</label>
    <input
      type="text"
      [(ngModel)]="apellido"
      name="apellido"
      placeholder="Ingrese su apellido"
    >

    <label>Edad</label>
    <input
      type="number"
      [(ngModel)]="edad"
      name="edad"
      placeholder="Ingrese su edad"
    >

    <label>Contraseña</label>
    <input
      type="password"
      [(ngModel)]="password"
      name="password"
      placeholder="Ingrese su contraseña"
    >

    <button
      class="boton"
      type="button"
      (click)="registrar()"
      [disabled]="cargando"
    >
      {{ cargando ? 'Registrando...' : 'Registrarse' }}
    </button>
  </form>

  <p class="mensaje" *ngIf="mensaje">
    {{ mensaje }}
  </p>
</section>
