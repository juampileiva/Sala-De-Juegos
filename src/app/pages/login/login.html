<section class="pagina">
  <h1>Iniciar sesión</h1>

  <p class="subtitulo">
    Ingresá con tu correo y contraseña para acceder a los juegos de la sala.
  </p>

  <form class="formulario">
    <label>Correo</label>
    <input type="email" placeholder="Ingrese su correo">

    <label>Contraseña</label>
    <input type="password" placeholder="Ingrese su contraseña">

    <button class="boton" type="button">Ingresar</button>
  </form>

  <h2>Accesos rápidos</h2>

  <div class="acciones">
    <button class="boton secundario" type="button">Jugador 1</button>
    <button class="boton secundario" type="button">Jugador 2</button>
    <button class="boton secundario" type="button">Jugador 3</button>
  </div>
</section>
