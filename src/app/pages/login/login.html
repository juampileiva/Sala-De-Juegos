<section class="pagina">
  <h1>Iniciar sesión</h1>

  <p class="subtitulo">
    Ingresá con tu correo y contraseña para acceder a los juegos de la sala.
  </p>

  <form class="formulario">
    <label>Correo</label>
    <input
      type="email"
      [(ngModel)]="email"
      name="email"
      placeholder="Ingrese su correo"
    >

    <label>Contraseña</label>
    <input
      type="password"
      [(ngModel)]="password"
      name="password"
      placeholder="Ingrese su contraseña"
    >

    <button
      class="boton"
      type="button"
      (click)="ingresar()"
      [disabled]="cargando"
    >
      {{ cargando ? 'Ingresando...' : 'Ingresar' }}
    </button>
  </form>

  <p class="mensaje" *ngIf="mensaje">
    {{ mensaje }}
  </p>

  <h2>Accesos rápidos</h2>

  <div class="acciones">
    <button
      class="boton secundario"
      type="button"
      *ngFor="let usuario of usuariosRapidos"
      (click)="cargarUsuarioRapido(usuario.email, usuario.password)"
    >
      {{ usuario.texto }}
    </button>
  </div>
</section>
