<section class="pagina">
  <h1>Iniciar sesión</h1>

  <p class="subtitulo">
    Ingresá con tu correo y contraseña para acceder a los juegos de la sala.
  </p>

  <form class="formulario">
    <label>Correo</label>
    <input
      type="email"
      [(ngModel)]="email"
      name="email"
      placeholder="Ingrese su correo"
    >

    <label>Contraseña</label>
    <input
      type="password"
      [(ngModel)]="password"
      name="password"
      placeholder="Ingrese su contraseña"
    >

    <button
      class="boton"
      type="button"
      (click)="ingresar()"
      [disabled]="cargando"
    >
      {{ cargando ? 'Ingresando...' : 'Ingresar' }}
    </button>
  </form>

  <p class="mensaje" *ngIf="mensaje">
    {{ mensaje }}
  </p>

  <!-- ACCESOS RAPIDOS -->
  <div class="accesos">
    <button class="boton secundario" (click)="toggleRapidos()">
      {{ mostrarRapidos ? 'Ocultar accesos' : 'Accesos rápidos' }}
    </button>

    <div class="dropdown" *ngIf="mostrarRapidos">
      <button
        *ngFor="let usuario of usuariosRapidos"
        (click)="cargarUsuarioRapido(usuario.email, usuario.password)"
      >
        {{ usuario.texto }}
      </button>
    </div>
  </div>
</section>
