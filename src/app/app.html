<header class="barra">
  <a class="marca" routerLink="/home" (click)="cerrarMenu()">
    Sala de Juegos
  </a>

  <nav class="nav">
    <a routerLink="/home" (click)="cerrarMenu()">Inicio</a>
    <a routerLink="/quien-soy" (click)="cerrarMenu()">Quién soy</a>

    <div class="menu-wrapper">
      <button
        type="button"
        class="boton-menu"
        [class.activo]="menuAbierto"
        (click)="abrirCerrarMenu()"
      >
        <span class="lineas">
          <span></span>
          <span></span>
          <span></span>
        </span>
        <span>Menú</span>
      </button>

      <div class="menu-flotante" *ngIf="menuAbierto">
        <ng-container *ngIf="estaLogueado">
          <div class="usuario-menu">
            <small>Sesión iniciada</small>
            <strong>{{ emailUsuario }}</strong>
          </div>

          <a routerLink="/ahorcado" (click)="cerrarMenu()">Ahorcado</a>
          <a routerLink="/mayor-menor" (click)="cerrarMenu()">Mayor o menor</a>
          <a routerLink="/preguntados" (click)="cerrarMenu()">Preguntados</a>
          <a routerLink="/no-explotes" (click)="cerrarMenu()">No explotes</a>
          <a routerLink="/resultados" (click)="cerrarMenu()">Resultados</a>
          <a routerLink="/chat" (click)="cerrarMenu()">Chat</a>

          <div class="separador"></div>

          <a class="salir" routerLink="/logout" (click)="cerrarMenu()">
            Cerrar sesión
          </a>
        </ng-container>

        <ng-container *ngIf="!estaLogueado">
          <a routerLink="/login" (click)="cerrarMenu()">Iniciar sesión</a>
          <a routerLink="/registro" (click)="cerrarMenu()">Registro</a>
        </ng-container>
      </div>
    </div>
  </nav>
</header>

<main>
  <router-outlet></router-outlet>
</main>
